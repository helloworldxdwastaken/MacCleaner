<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A5BFF"/>
      <stop offset="0.55" stop-color="#3E7BFA"/>
      <stop offset="1" stop-color="#00C6FB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0B2A66" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- macOS squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#glow)"/>

  <!-- The mark: a treemap mosaic — the app's signature disk map, distilled.
       One dominant volume tile + a split column of smaller ones, sized and
       spaced like a real treemap layout. -->
  <g filter="url(#softShadow)">
    <rect x="232" y="252" width="320" height="520" rx="56" fill="#FFFFFF" opacity="0.96"/>
    <rect x="584" y="252" width="208" height="256" rx="44" fill="#FFFFFF" opacity="0.72"/>
    <rect x="584" y="540" width="96"  height="232" rx="36" fill="#FFFFFF" opacity="0.52"/>
    <rect x="712" y="540" width="80"  height="232" rx="32" fill="#FFFFFF" opacity="0.90"/>
  </g>

  <!-- top sheen -->
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#gloss)"/>
</svg>
