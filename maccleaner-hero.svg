<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1729"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <radialGradient id="glowT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3E7BFA" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#3E7BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00C6FB" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#00C6FB" stop-opacity="0"/>
    </radialGradient>
    <!-- brand logo gradient (indigo -> blue -> cyan) -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A5BFF"/>
      <stop offset="0.55" stop-color="#3E7BFA"/>
      <stop offset="1" stop-color="#00C6FB"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6A5BFF"/>
      <stop offset="0.5" stop-color="#3E7BFA"/>
      <stop offset="1" stop-color="#00C6FB"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1c2740" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="logoShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#06122e" flood-opacity="0.55"/>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="1280" height="440" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#grid)" opacity="0.6"/>
    <circle cx="120" cy="80" r="320" fill="url(#glowT)"/>
    <circle cx="1180" cy="400" r="340" fill="url(#glowC)"/>

    <!-- LEFT: logo + wordmark + copy -->
    <g transform="translate(72,96)">
      <!-- brand mark: gradient squircle + white sparkle / clean-sweep -->
      <g filter="url(#logoShadow)">
        <rect x="0" y="0" width="88" height="88" rx="22" fill="url(#brand)"/>
        <g transform="translate(4,4)">
          <path d="M20 62 A26 26 0 1 1 66 58" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
          <circle cx="66" cy="58" r="4" fill="#ffffff"/>
          <path d="M44 20 Q46.1 37 50.6 39 Q64 44 50.6 46 Q46.1 48 44 65 Q41.9 48 37.4 46 Q24 44 37.4 39 Q41.9 37 44 20 Z" fill="#ffffff"/>
        </g>
      </g>

      <!-- wordmark -->
      <text x="112" y="58" fill="url(#word)" font-size="66" font-weight="800" letter-spacing="-1.5">MacCleaner</text>
      <text x="115" y="88" fill="#8ea2c9" font-size="15" letter-spacing="4" font-weight="600">MACOS&#160;CLEANER&#160;SUITE</text>

      <text x="2" y="164" fill="#e2e8f0" font-size="27" font-weight="600">Reclaim gigabytes in one smart scan.</text>
      <text x="2" y="200" fill="#8a99b5" font-size="17">System junk · caches · duplicates · large &amp; old files —</text>
      <text x="2" y="224" fill="#8a99b5" font-size="17">plus a GrandPerspective-style disk treemap. All local, all safe.</text>

      <!-- pseudo buttons -->
      <g transform="translate(2,256)">
        <rect x="0" y="0" width="196" height="46" rx="10" fill="url(#bar)"/>
        <text x="98" y="29" text-anchor="middle" fill="#06122e" font-size="16" font-weight="700">⬇  Download app</text>
        <rect x="212" y="0" width="176" height="46" rx="10" fill="none" stroke="#33415c" stroke-width="1.5"/>
        <text x="300" y="29" text-anchor="middle" fill="#c7d2e4" font-size="16" font-weight="600">Smart Scan</text>
      </g>
    </g>

    <!-- RIGHT: Smart Scan results panel -->
    <g transform="translate(744,40)" filter="url(#soft)">
      <rect x="0" y="0" width="472" height="360" rx="16" fill="#0c1424" stroke="#1f2c47" stroke-width="1.5"/>
      <!-- window chrome -->
      <circle cx="22" cy="24" r="6" fill="#f43f5e"/>
      <circle cx="42" cy="24" r="6" fill="#fbbf24"/>
      <circle cx="62" cy="24" r="6" fill="#34d399"/>
      <text x="236" y="29" text-anchor="middle" fill="#5f6f8c" font-size="13" font-weight="600">Smart&#160;Scan&#160;&#160;·&#160;&#160;Macintosh&#160;HD</text>

      <!-- big reclaimable headline -->
      <g transform="translate(28,64)">
        <text x="0" y="30" fill="#dbe4f3" font-size="15" font-weight="600">Reclaimable space found</text>
        <text x="0" y="92" fill="url(#bar)" font-size="66" font-weight="800" letter-spacing="-2">48.2 GB</text>
      </g>

      <!-- category rows -->
      <g transform="translate(28,182)" font-size="14">
        <!-- row 1 -->
        <rect x="0" y="0" width="416" height="40" rx="9" fill="#101c30"/>
        <circle cx="22" cy="20" r="7" fill="#6A5BFF"/>
        <text x="42" y="25" fill="#c7d2e4" font-weight="600">System junk</text>
        <text x="404" y="25" text-anchor="end" fill="#8ea2c9">21.4 GB</text>
        <!-- row 2 -->
        <rect x="0" y="50" width="416" height="40" rx="9" fill="#101c30"/>
        <circle cx="22" cy="70" r="7" fill="#3E7BFA"/>
        <text x="42" y="75" fill="#c7d2e4" font-weight="600">Caches &amp; logs</text>
        <text x="404" y="75" text-anchor="end" fill="#8ea2c9">13.7 GB</text>
        <!-- row 3 -->
        <rect x="0" y="100" width="416" height="40" rx="9" fill="#101c30"/>
        <circle cx="22" cy="120" r="7" fill="#00C6FB"/>
        <text x="42" y="125" fill="#c7d2e4" font-weight="600">Duplicates</text>
        <text x="404" y="125" text-anchor="end" fill="#8ea2c9">8.0 GB</text>
      </g>

      <!-- footer progress bar -->
      <rect x="28" y="336" width="416" height="6" rx="3" fill="#1b2740"/>
      <rect x="28" y="336" width="300" height="6" rx="3" fill="url(#bar)"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="439" rx="20" fill="none" stroke="#1f2c47" stroke-width="1"/>
</svg>
