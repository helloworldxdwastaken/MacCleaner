<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A5BFF"/>
      <stop offset="0.55" stop-color="#3E7BFA"/>
      <stop offset="1" stop-color="#00C6FB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0B2A66" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#glow)"/>

  <!-- clean sweep: orbital swoosh around the sparkle -->
  <g filter="url(#softShadow)">
    <path d="M 268 742
             A 330 330 0 1 1 780 700"
          fill="none" stroke="url(#sweep)" stroke-width="58" stroke-linecap="round"/>
    <!-- comet head dot at sweep end -->
    <circle cx="780" cy="700" r="44" fill="#FFFFFF"/>
  </g>

  <!-- main 4-point sparkle -->
  <g filter="url(#softShadow)">
    <path d="M 512 268
             Q 536 464 588 488
             Q 748 512 588 536
             Q 536 560 512 756
             Q 488 560 436 536
             Q 276 512 436 488
             Q 488 464 512 268 Z"
          fill="#FFFFFF"/>
  </g>

  <!-- secondary sparkles -->
  <path d="M 742 296 Q 750 352 766 360 Q 822 368 766 376 Q 750 384 742 440 Q 734 384 718 376 Q 662 368 718 360 Q 734 352 742 296 Z"
        fill="#FFFFFF" opacity="0.92"/>
  <path d="M 306 328 Q 311 362 321 367 Q 355 372 321 377 Q 311 382 306 416 Q 301 382 291 377 Q 257 372 291 367 Q 301 362 306 328 Z"
        fill="#FFFFFF" opacity="0.8"/>
</svg>
